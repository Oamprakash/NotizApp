# Builds an installable Android APK and runs the tests on every push to main and on pull requests.
#
# Download the APK: GitHub → Actions → the run → Artifacts → "notiz-debug-apk".
#
# Push notifications in the APK (optional): add a repository secret GOOGLE_SERVICES_JSON containing
# the full contents of composeApp/google-services.json (Settings → Secrets and variables → Actions).
# Without it the APK still works, just without push.

name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add google-services.json (if the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > composeApp/google-services.json
            echo "Push notifications enabled for this build"
          else
            echo "GOOGLE_SERVICES_JSON not set: building without push notifications"
          fi

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notiz-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: composeApp/build/reports/tests/
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test Supabase Edge Functions
        working-directory: supabase/functions
        run: |
          deno check push/index.ts create-payment-link/index.ts razorpay-webhook/index.ts delete-account/index.ts
          deno test --allow-env push/index_test.ts create-payment-link/index_test.ts razorpay-webhook/index_test.ts delete-account/index_test.ts
